name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Composer audit
        run: composer install --no-interaction --no-progress && composer audit
      - name: npm audit (production dependencies)
        run: npm ci && npm audit --omit=dev --audit-level=high
