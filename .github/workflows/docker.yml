name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: open-laravel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 \
            -e APP_ENV=production -e APP_DEBUG=false \
            -e APP_KEY=base64:$(openssl rand -base64 32) \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/ci.sqlite \
            -e SESSION_DRIVER=file -e CACHE_STORE=file open-laravel:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/up && exit 0
            sleep 2
          done
          docker logs app
          exit 1
