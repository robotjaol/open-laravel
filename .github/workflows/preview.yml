name: Deploy preview

# Publishes the static, backend-free UI preview to GitHub Pages.
# One-time setup: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ['resources/**', 'vite.preview.config.ts', 'preview.html', 'package*.json', '.github/workflows/preview.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:preview
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/preview
      - id: deployment
        uses: actions/deploy-pages@v4
