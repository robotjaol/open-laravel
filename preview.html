<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Open Laravel preview</title>
        <script>
            (function () {
                try {
                    var v = localStorage.getItem('appearance');
                    var dark = v === 'dark' || (v !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
                    if (dark) document.documentElement.classList.add('dark');
                } catch (e) {}
            })();
        </script>
    </head>
    <body class="antialiased">
        <div id="app"></div>
        <script type="module" src="/resources/js/preview.tsx"></script>
    </body>
</html>
